<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนการดำเนินงาน HA, HAIT และ Hospital Round โรงพยาบาลตาพระยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#14304A; --ink-2:#4A5F73; --paper:#F2F5F7; --card:#FFFFFF; --line:#D3DBE3;
  --round:#1F7A5A; --round-soft:#DCEFE6;
  --survey:#2B59C3; --survey-soft:#DCE6FA;
  --hait:#A8690C; --hait-soft:#F7E9CC;
  --review:#6B4FA3; --review-soft:#E6DEF4;
  --alert:#B3261E; --alert-soft:#F8DAD7;
  --backup:#FFE066; --backup-ink:#4D3B00;
  --txt:#111111; --txt-h:#0A3FD0; --txt-h2:#3F5FC4;
  --aft:#CFEFF5; --aft-strong:#2AA7C0;
  --weekend:#8A99A8; --focus:#0B63CE;
  --font:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E4ECF3; --ink-2:#A9B8C6; --paper:#0F1A24; --card:#18273A; --line:#2C3E52;
    --round:#4CC38F; --round-soft:#17392E;
    --survey:#7FA5F5; --survey-soft:#1B2D54;
    --hait:#E3A94A; --hait-soft:#3D2E14;
    --review:#B79BEA; --review-soft:#2D2347;
    --alert:#F2877F; --alert-soft:#451B18;
    --backup:#C9A227; --backup-ink:#201800;
    --txt:#F2F5F8; --txt-h:#8AB4FF; --txt-h2:#7A9FE8;
    --aft:#174650; --aft-strong:#4FC3DB;
    --weekend:#74869A; --focus:#7DB4FF;
  }
}
:root[data-theme="dark"]{
  --ink:#E4ECF3; --ink-2:#A9B8C6; --paper:#0F1A24; --card:#18273A; --line:#2C3E52;
  --round:#4CC38F; --round-soft:#17392E;
  --survey:#7FA5F5; --survey-soft:#1B2D54;
  --hait:#E3A94A; --hait-soft:#3D2E14;
  --review:#B79BEA; --review-soft:#2D2347;
  --alert:#F2877F; --alert-soft:#451B18;
  --backup:#C9A227; --backup-ink:#201800;
  --txt:#F2F5F8; --txt-h:#8AB4FF; --txt-h2:#7A9FE8;
  --aft:#174650; --aft-strong:#4FC3DB;
  --weekend:#74869A; --focus:#7DB4FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--txt);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 14px 96px}
.top{padding:16px 2px 6px}
.top h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.1px}
.top p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mode{font-size:13px!important}
.mode b{font-weight:500;color:var(--round)}
.mode.ro b{color:var(--alert)}

/* next-round hero */
.next{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px 18px;margin:10px 0 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .next{background:#1E3550;color:#E4ECF3}}
:root[data-theme="dark"] .next{background:#1E3550;color:#E4ECF3}
.next .when{font-size:30px;font-weight:600;line-height:1.15}
.next .what{grid-column:1/2;font-size:15px;opacity:.92}
.next .count{grid-row:1/3;grid-column:2/3;align-self:center;text-align:center;border:1.5px solid currentColor;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.next button{grid-column:1/3;margin-top:10px;justify-self:start;background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:7px 14px;font-weight:500}

/* year ribbon */
.ribbon{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:54px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px 0;text-align:center;font-size:14px;font-weight:500;position:relative}
.chip small{display:block;color:var(--ink-2);font-size:11px;font-weight:400}
.chip i{display:block;height:5px;border-radius:0 0 8px 8px;margin:6px -8px 0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip.now::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--alert)}
.k-aft{background:var(--aft-strong)} .k-round{background:var(--round)} .k-survey{background:var(--survey)} .k-hait{background:var(--hait)} .k-review{background:var(--review)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.calhead h2{margin:0;font-size:18px;font-weight:600}
.calhead .phase{font-size:13px;color:var(--ink-2)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--ink-2);padding:2px 0}
.day{min-height:56px;border-radius:9px;border:1px solid transparent;background:var(--card);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:15px;position:relative}
.day.empty{background:transparent;border:0;pointer-events:none}
.day .lb{font-size:10.5px;line-height:1.15;font-weight:500}
.day.wk{color:var(--weekend)}
.day.hol{background:var(--alert-soft);color:var(--alert)}
.day.hait{background:var(--hait-soft)}
.day.round{background:var(--round);color:#fff;font-weight:600}
.day.backup{background:var(--backup);color:var(--backup-ink);font-weight:600}
.day.aft{background:var(--aft);color:var(--txt);font-weight:600}
.day .am{position:absolute;bottom:3px;left:50%;margin-left:-8px;width:16px;height:5px;border-radius:3px;background:var(--aft-strong);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.day.survey{background:var(--survey);color:#fff;font-weight:600}
.day.review{background:var(--review);color:#fff;font-weight:600}
.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:#FFD166}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 4px;font-size:13px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

.agenda{margin:14px 0 0;display:grid;gap:8px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:11px 12px}
.ev .d{font-weight:600;font-size:15px;line-height:1.25}
.ev .d small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.ev .t{font-weight:500;line-height:1.35}
.ev .s{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.ev.aft{border-left-color:var(--aft-strong)} .ev.round{border-left-color:var(--round)} .ev.survey{border-left-color:var(--survey)} .ev.hait{border-left-color:var(--hait)} .ev.review{border-left-color:var(--review)}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabbar .in{display:flex;width:100%;max-width:760px;gap:4px}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:14px;font-weight:500;color:var(--ink-2);position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .n{position:absolute;top:2px;right:10px;background:var(--alert);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
[hidden]{display:none!important}

/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px;font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:9px;padding:9px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--alert);border-color:var(--alert);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:500;background:var(--round-soft);color:var(--round)}
.pill.hi{background:var(--alert-soft);color:var(--alert)} .pill.mid{background:var(--hait-soft);color:var(--hait)} .pill.done{background:var(--line);color:var(--ink-2)} .pill.af{background:var(--aft);color:var(--txt)} .pill.bk{background:var(--backup);color:var(--backup-ink)} .pill.survey{background:var(--survey-soft);color:var(--survey)} .pill.review{background:var(--review-soft);color:var(--review)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.issue{border-left:5px solid var(--line);display:grid;gap:4px}
.issue.hi{border-left-color:var(--alert)} .issue.mid{border-left-color:var(--hait)} .issue.low{border-left-color:var(--round)}
.issue .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.issue.closed{opacity:.62}
.empty-note{text-align:center;color:var(--ink-2);padding:26px 10px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;border-radius:999px;padding:12px 18px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat .a b{color:var(--alert)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
tr[data-r]{cursor:pointer}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--round)}
.tl{display:grid;gap:8px}
.tl .item{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start}
.tl .item b{display:block;font-weight:600}
.tl .sw{width:10px;height:100%;min-height:36px;border-radius:5px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;position:sticky;top:-14px;background:var(--paper);padding:2px 0 8px;z-index:1}
.sheet h2{margin:0;font-size:20px;font-weight:600;line-height:1.25}
.step{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.step .tm{font-weight:600;font-size:14.5px;color:var(--round)}
.step.hait .tm{color:var(--hait)}
.step .nm{font-weight:500}
.step .pt{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.step .pp{font-size:13px;color:var(--ink-2)}
.warnbox{background:var(--alert-soft);color:var(--alert);border-radius:9px;padding:7px 10px;font-size:14px;margin:8px 0}
.okbox{background:var(--round-soft);color:var(--round);border-radius:9px;padding:7px 10px;font-size:14px;margin:8px 0}
details{margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;font-weight:500}
details ul{margin:6px 0 2px;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;z-index:40;font-size:14.5px;max-width:90vw}
.itm{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.itm .id{font-weight:600;color:var(--ink-2)}
.st{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;min-width:78px}
.st[data-s="1"]{background:var(--hait-soft);color:var(--hait);border-color:transparent}
.st[data-s="2"]{background:var(--round-soft);color:var(--round);border-color:transparent}
.st[data-s="3"]{background:var(--line);color:var(--ink-2)}
.foot{color:var(--ink-2);font-size:13px;margin:18px 2px}
/* HA = black text, HAIT = blue text */
.ht,.ht .nm,.ht .tm,.ht h2,.ht h3,.ht b,.ht .t,.ht .d{color:var(--txt-h)}
.ht .muted,.ht .small,.ht .pt,.ht .pp,.ht .s{color:var(--txt-h2)}
.step.hait .tm,.step.hait .nm{color:var(--txt-h)}
.step.hait .pt,.step.hait .pp{color:var(--txt-h2)}
.ev.hait .t,.ev.hait .d{color:var(--txt-h)} .ev.hait .s{color:var(--txt-h2)}
.day.hait{color:var(--txt-h);font-weight:600}
#v-hait{color:var(--txt-h)} #v-hait .muted,#v-hait .small.muted{color:var(--txt-h2)} #v-hait .id{color:var(--txt-h2)}
.issue.work-hait,.issue.work-hait b{color:var(--txt-h)} .issue.work-hait .muted{color:var(--txt-h2)}
.pill.tg{background:transparent;border:1px solid var(--txt);color:var(--txt);padding:0 8px}
.pill.tg.h{border-color:var(--txt-h);color:var(--txt-h)}
.legend .tk::before{display:none} .legend .tk{font-weight:500;color:var(--txt)} .legend .tk.h{color:var(--txt-h)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>แผนการดำเนินงาน HA, HAIT และ Hospital Round</h1>
    <p>โรงพยาบาลตาพระยา ต.ค. 2569 ถึง ก.ย. 2570</p>
    <p id="mode" class="mode"></p>
  </header>
  <section id="next" class="next" aria-live="polite"></section>
  <nav id="ribbon" class="ribbon" aria-label="เลือกเดือน"></nav>

  <main>
    <section id="v-cal"></section>
    <section id="v-iss" hidden></section>
    <section id="v-over" hidden></section>
    <section id="v-hait" hidden></section>
  </main>
  <p class="foot" id="foot"></p>
</div>

<button id="fab" class="btn fab" hidden>+ บันทึกประเด็น</button>
<div class="tabbar" role="tablist" aria-label="เมนูหลัก"><div class="in" id="tabs"></div></div>
<div id="layer"></div>

<script>

const ERR_TXT = {

async function remoteGetJson(u){
  let r; try { r = await fetch(u); } catch (e) { throw { code: 'blocked' }; }
  if (r && r.status === 404) throw { code: 'notfound' };
  let j; try { j = await r.json(); } catch (e) { throw { code: 'notjson' }; }
  return j;
}
async function remoteCall(body){
  let r;
  try { r = await fetch(remote.cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: remote.cfg.key, by: shared.uid || '' }, body)) }); }
  catch (e) { throw { code: 'blocked' }; }
  if (r && r.status === 404) throw { code: 'notfound' };
  let j; try { j = await r.json(); } catch (e) { throw { code: 'notjson' }; }
  if (!j.ok) throw { code: j.error || 'error' };
  return j;
}
async function remoteWrite(body){ try { applyRemote(await remoteCall(body)); remote.ok = true; remote.err = ''; return true; } catch (e) { if (e && ERR_TXT[e.code] && e.code !== 'unauthorized' && e.code !== 'busy') { remote.ok = false; remote.err = e.code; } fail(e); return false; } }
function applyRemote(j, quiet){
  S.issues = (j.issues || []).map(i => Object.assign({}, i));
  const d = j.dates || {}; S.dates = Object.assign(DEF_DATES(), d);
  ['round', 'backup', 'aft', 'aftStatus'].forEach(k => { S.dates[k] = Object.assign({}, d[k] || {}); });
  const hh = j.hait || {}; S.haitCat = Object.assign({}, hh.cat || {}); S.plus = Object.assign({}, hh.plus || {});
  if (typeof j.ver === 'number') remote.ver = j.ver;

}
async function refreshRemote(){

    const j = await remoteGetJson(u);

}

async function pollRemote(){
  if (!remote.cfg || !remote.cfg.url || document.hidden) return;
  try {
    const u = remote.cfg.url + (remote.cfg.url.indexOf('?') >= 0 ? '&' : '?') + 'action=ver&key=' + encodeURIComponent(remote.cfg.key || '') + '&t=' + Date.now();
    const j = await remoteGetJson(u);
    if (!j.ok){ remote.ok = false; remote.err = j.error || 'error'; render(); return; }
    if (!remote.ok){ remote.ok = true; remote.err = ''; }
    if (j.ver !== remote.ver) await refreshRemote();
  } catch (e) { if (remote.ok){ remote.ok = false; remote.err = (e && e.code) || 'blocked'; render(); } }
}

  if (y === 2027 && m === 5) return 'survey';

}

function dayInfo(d){
  const info = { cls: [], lb: '', open: false, click: null };
  const dow = parse(d).getDay();
  if (dow === 0 || dow === 6) info.cls.push('wk');
  if (HOL[d]) { info.cls.push('hol'); info.click = () => toast(fmt(d, { wd: true }) + ': ' + HOL[d]); }
  if (S.dates.haitFrom && S.dates.haitTo && d >= S.dates.haitFrom && d <= S.dates.haitTo) { info.cls.push('hait'); info.click = () => openPhase('haitA'); }
  const s = SESS.find(x => effDate(x) === d);
  if (s){ info.cls = info.cls.filter(c => c !== 'hol' && c !== 'hait'); info.cls.push('round'); info.lb = 'รอบ ' + s.label; info.open = openFor(s.label) > 0; info.click = () => openRound(s); }
  else {
    const bk = SESS.find(x => effBackup(x) === d);
    if (bk){ info.cls = info.cls.filter(c => c !== 'hol' && c !== 'hait'); info.cls.push('backup'); info.lb = 'สำรอง ' + bk.label; info.click = () => openRound(bk); }
  }
  if (S.dates.survey === d){ info.cls = info.cls.filter(c => c !== 'round'); info.cls.push('survey'); info.lb = 'เยี่ยม HA'; info.click = () => openPhase('survey'); }
  if (S.dates.review === d){ info.cls.push('review'); info.lb = 'ทบทวน'; info.click = () => openPhase('review'); }
  const aa = aftOn(d);
  if (aa.length){
    if (info.cls.some(c => c === 'round' || c === 'backup' || c === 'survey' || c === 'review')) info.am = true;
    else { info.cls = info.cls.filter(c => c !== 'hol' && c !== 'hait'); info.cls.push('aft'); info.lb = 'บ่าย'; info.click = () => openAft(aa[0]); }
  }
  if (d === todayISO()) info.cls.push('today');
  return info;
}

    box.append(h('button', { class: 'tab', role: 'tab', 'aria-selected': String(ui.tab === k), on: { click: () => { ui.tab = k; render(); window.scrollTo(0, 0); } } }, lb, k === 'iss' && openN ? h('span', { class: 'n' }, openN) : null));
  });
}
function render(){
  renderNext(); renderRibbon(); renderTabs();
  ['cal', 'iss', 'over', 'hait'].forEach(k => { $('#v-' + k).hidden = ui.tab !== k; });
  $('#ribbon').hidden = ui.tab !== 'cal'; $('#next').hidden = ui.tab !== 'cal';
  $('#fab').hidden = !(ui.tab === 'iss' || ui.tab === 'cal') || ro();
  const md = $('#mode'); md.textContent = ''; md.className = 'mode' + (ro() || (shared.provider === 'sheet' && !remote.ok) ? ' ro' : '');
  md.append(h('b', null, shared.provider === 'sheet' ? (remote.ok ? 'โหมดทีม (Google Sheets) ซิงก์แล้ว' : (remote.err === 'unauthorized' ? 'รหัสผ่านทีมไม่ถูกต้อง' : 'โหมดทีม เชื่อมต่อไม่ได้ ใช้ข้อมูลล่าสุด')) : shared.on ? (shared.canWrite ? 'โหมดทีม ซิงก์สด' : 'โหมดทีม ดูได้อย่างเดียว') : (shared.connecting ? 'กำลังเชื่อมต่อส่วนกลาง' : 'โหมดเครื่องนี้ ไม่แชร์กับทีม')));
  if (ui.tab === 'cal') renderCal();
  if (ui.tab === 'iss') renderIssues();
  if (ui.tab === 'over') renderOver();
  if (ui.tab === 'hait') renderHait();
  $('#foot').textContent = shared.on ? 'ตารางนี้เป็นข้อเสนอ ปรับวันได้เอง การเปลี่ยนแปลงทุกคนเห็นพร้อมกัน' : storageOK ? 'ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ สำรองข้อมูลได้ในหน้าภาพรวม ตารางนี้เป็นข้อเสนอ ปรับวันได้เอง' : 'เครื่องนี้บันทึกอัตโนมัติไม่ได้ กด "สำรองข้อมูล" ในหน้าภาพรวมก่อนปิดหน้านี้';
}
$('#fab').addEventListener('click', () => openIssue({}));
render();
async function initShared(){
  if (!(window.claude && window.claude.use)) return;
  try {
    const db = await window.claude.use('db');
    if (remote.cfg && remote.cfg.url) return;
    if (!db){ shared.connecting = false; render(); return; }
    let user = null; try { user = await window.claude.use('user'); } catch (e) {}
    shared.local = { issues: S.issues.slice() };
    shared.db = db; shared.user = user;
    if (user){
      try { shared.uid = (await user.id()) || ''; } catch (e) {}
      try { const c = await user.can('data.write'); shared.canWrite = c !== false; } catch (e) {}
    }
    shared.on = true; shared.provider = 'claude'; shared.connecting = false;
    S.issues = []; S.dates = DEF_DATES(); S.haitCat = {}; S.plus = {};
    const onErr = e => { if (e && e.code === 'revoked') { shared.on = false; S.issues = shared.local.issues; render(); } };
    db.collection('issues').onSnapshot(snap => { if (shared.provider !== 'claude') return; S.issues = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, onErr);
    db.doc('settings/dates').onSnapshot(snap => { if (shared.provider !== 'claude') return; const d = snap.exists ? snap.data() : {}; S.dates = Object.assign(DEF_DATES(), d); S.dates.round = Object.assign({}, d.round || {}); S.dates.backup = Object.assign({}, d.backup || {}); S.dates.aft = Object.assign({}, d.aft || {}); S.dates.aftStatus = Object.assign({}, d.aftStatus || {}); render(); }, onErr);
    db.doc('settings/hait').onSnapshot(snap => { if (shared.provider !== 'claude') return; const d = snap.exists ? snap.data() : {}; S.haitCat = Object.assign({}, d.cat || {}); S.plus = Object.assign({}, d.plus || {}); render(); }, onErr);
    render();
  } catch (e) { shared.connecting = false; render(); }
}
if (remote.cfg && remote.cfg.url) initRemote();
else if (TEAM_DEFAULT.url) { shared.connecting = false; render(); openJoin(); }
else initShared();
})();
</script>
